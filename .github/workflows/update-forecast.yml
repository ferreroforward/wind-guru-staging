name: Update wind forecast

# STAGING: scheduled runs disabled on purpose so this test site doesn't
# quietly burn Action minutes / Open-Meteo API calls twice a day forever.
# Trigger a fresh snapshot manually from the Actions tab whenever you want
# to test with current data. Re-enable the `schedule:` block below (copy it
# back from the production repo's workflow file) if you want this staging
# site to also refresh automatically.
on:
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply rider-feedback calibration
        run: node scripts/apply-feedback.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate forecast snapshot
        run: node scripts/generate.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "wind-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast.json data/calibration-overrides.json data/live-verification-log.json
          git diff --staged --quiet && exit 0
          git commit -m "Update forecast snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
