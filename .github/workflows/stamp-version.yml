name: Stamp app version

# Records which commit is actually live and when it was deployed, separate
# from the twice-daily forecast snapshot. Runs on every push to main EXCEPT
# ones that only touch data/ — that excludes both the forecast Action's own
# commits and this workflow's own commits, so it can't trigger itself in a
# loop, and it only re-stamps when the app itself (index.html, assets/,
# scripts/, etc.) actually changes.

# STAGING: the push trigger is disabled on purpose. It fires on every push
# to this branch, commits data/version.json right back to main, and that
# extra commit is what makes your NEXT push get rejected ("fetch first")
# until it's merged in locally. Trigger it manually from the Actions tab
# if you want a version stamp while testing. Re-enable by copying the
# `push:` block back from the production repo's workflow file.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write data/version.json
        run: |
          mkdir -p data
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > data/version.json <<EOF
          {
            "version": "$SHA",
            "message": "$MSG",
            "deployed_at": "$NOW"
          }
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "wind-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/version.json
          git diff --staged --quiet && exit 0
          git commit -m "Stamp app version [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts"
          exit 1
